[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-baseline"
version = "0.1.0"
description = "Offline, allowlisted Codex configuration baselines with machine overlays and drift reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BohaoWorks"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
codex-baseline = "codex_baseline.cli:main"

[project.urls]
Repository = "https://github.com/BohaoWorks/codex-baseline"
Issues = "https://github.com/BohaoWorks/codex-baseline/issues"

[tool.setuptools]
packages = ["codex_baseline"]
